spring:
  application:
    name: file_upload_service
  flyway:
    enabled: true
    locations: classpath:db/migration
management:
#  export histogram P95, P99...
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true

      percentiles:
        http.server.requests: 0.5,0.9,0.95,0.99
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - prometheus
          - metrics
  endpoint:
    health:
      show-details: always
server:
  port: 20001
logging:
  level:
    org.flywaydb: info
