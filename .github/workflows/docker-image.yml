name: Build and Push Docker Image

on:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Build without tests
        run: ./mvnw clean package -DskipTests

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ secrets.DOCKER_USERNAME }}/file-upload-service:${{ github.sha }} .

      - name: Push Docker image
        run: |
          docker push \
            ${{ secrets.DOCKER_USERNAME }}/file-upload-service:${{ github.sha }}

      # ==========================================
      # GitOps: update infrastructure repository
      # ==========================================

      - name: Checkout infra repository
        uses: actions/checkout@v4
        with:
          repository: huyhai1994/kubernetes_infra
          token: ${{ secrets.DOCKER_TOKEN }}
          ref: master

      - name: Update image tag
        run: |
          sed -i \
            "s|image: huyhai1994/file-upload-service:.*|image: huyhai1994/file-upload-service:${{ github.sha }}|" \
            file-upload-service/deployment.yaml

      - name: Show updated manifest
        run: |
          grep "image:" file-upload-service/deployment.yml

      - name: Commit and push infra change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add file-upload-service/deployment.yml

          if git diff --cached --quiet; then
            echo "No deployment changes"
          else
            git commit -m "deploy file-upload-service ${{ github.sha }}"
            git push origin master
          fi